services:
  - type: web
    name: teatr-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
